name: LAST WHISTLE CI
on:
  workflow_dispatch:
  push:
  pull_request:

concurrency:
  group: last-whistle-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check out PR head for roster refresh
        if: github.event_name == 'pull_request' && (github.head_ref == 'feature/full-world-squads-2026-27' || github.head_ref == 'feature/world-roster-coverage-expansion' || github.head_ref == 'feature/egyptian-league-sourced-squads')
        run: |
          git fetch origin "$GITHUB_HEAD_REF"
          git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
      - name: Refresh current rosters on development branch
        if: ((github.ref == 'refs/heads/feature/full-world-squads-2026-27' || github.ref == 'refs/heads/feature/world-roster-coverage-expansion' || github.ref == 'refs/heads/feature/egyptian-league-sourced-squads') && github.event_name != 'pull_request') || (github.event_name == 'pull_request' && (github.head_ref == 'feature/full-world-squads-2026-27' || github.head_ref == 'feature/world-roster-coverage-expansion' || github.head_ref == 'feature/egyptian-league-sourced-squads'))
        run: |
          if node -e 'const fs=require("node:fs"); try { const r=JSON.parse(fs.readFileSync("world-roster-audit.json","utf8")); process.exit(r.status==="complete" && r.refreshRevision===2 && r.allLeagueMinimumsMet===true && r.totalTeams>=266 && r.totalPlayers>=4300 && Array.isArray(r.leagues) && r.leagues.some(league => league.leagueId==="argentina") ? 0 : 1); } catch (_) { process.exit(1); }'; then
            echo "A complete sourced-roster snapshot already exists; refresh skipped."
          else
            node scripts/refresh-world-squads.cjs
          fi
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('world-roster-audit.json', 'utf8'));
          if (report.status !== 'complete' || report.allLeagueMinimumsMet !== true) {
            throw new Error('Incomplete world squad data: ' + JSON.stringify(report.leagues));
          }
          if (report.refreshRevision !== 2 || report.totalTeams < 266 || report.totalPlayers < 4300 || !report.leagues.some(league => league.leagueId === 'argentina')) {
            throw new Error('Insufficient squad coverage: ' + report.totalTeams + ' teams, ' + report.totalPlayers + ' players');
          }
          console.log('Sourced squad snapshot covers ' + report.totalTeams + ' clubs and ' + report.totalPlayers + ' players.');
          NODE
      - name: Add available Egyptian Pro League official squads
        if: (github.ref == 'refs/heads/feature/egyptian-league-sourced-squads' && github.event_name != 'pull_request') || (github.event_name == 'pull_request' && github.head_ref == 'feature/egyptian-league-sourced-squads')
        run: |
          # Use the checked-in source snapshot for ordinary push/PR regression tests.
          # A manual workflow_dispatch deliberately refreshes official pages from the web.
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] && node -e 'const fs=require("node:fs"); try { const r=JSON.parse(fs.readFileSync("world-roster-audit.json","utf8")); const e=r.supplementalCoverage && r.supplementalCoverage.egypt; process.exit(r.status==="complete" && e && e.season==="2026/27" && e.importedClubs>=17 && e.importedPlayers>=500 ? 0 : 1); } catch (_) { process.exit(1); }'; then
            echo "Using the checked-in Egyptian squad snapshot (17 clubs / 500+ player entries)."
          else
            node scripts/refresh-egyptian-pro-league.cjs
          fi
      - name: Commit refreshed roster snapshot on development branch
        if: ((github.ref == 'refs/heads/feature/full-world-squads-2026-27' || github.ref == 'refs/heads/feature/world-roster-coverage-expansion' || github.ref == 'refs/heads/feature/egyptian-league-sourced-squads') && github.event_name != 'pull_request') || (github.event_name == 'pull_request' && (github.head_ref == 'feature/full-world-squads-2026-27' || github.head_ref == 'feature/world-roster-coverage-expansion' || github.head_ref == 'feature/egyptian-league-sourced-squads'))
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add football-world-rosters.js public/football-world-rosters.js world-roster-audit.json public/world-roster-audit.json
          if git diff --cached --quiet; then
            echo "Roster snapshot already current."
          else
            git commit -m "Refresh 2026/27 verified world squad snapshot"
            target_branch="$GITHUB_REF_NAME"
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then target_branch="$GITHUB_HEAD_REF"; fi
            # The branch may receive code/workflow fixes while this long scrape runs.
            # Rebase the generated data-only commit on the latest head before pushing.
            git fetch origin "$target_branch"
            git rebase "origin/$target_branch"
            git push origin "HEAD:$target_branch"
          fi
      - run: npm test
      - run: npm run build

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Run real-browser smoke test
        run: node scripts/test-browser-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: last-whistle-browser-smoke
          path: ${{ runner.temp }}/last-whistle-browser-smoke.png
          if-no-files-found: ignore
