name: LAST WHISTLE CI
on:
  workflow_dispatch:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Run real-browser smoke test
        run: node scripts/test-browser-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: last-whistle-browser-smoke
          path: ${{ runner.temp }}/last-whistle-browser-smoke.png
          if-no-files-found: ignore
