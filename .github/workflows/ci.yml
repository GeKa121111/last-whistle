name: LAST WHISTLE CI
on:
  workflow_dispatch:
  push:
  pull_request:

# Serialize push and PR runs for the same branch so only one job can refresh/push roster data.
concurrency:
  group: last-whistle-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check out PR head for roster refresh
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/full-world-squads-2026-27'
        run: |
          git fetch origin "$GITHUB_HEAD_REF"
          git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
      - name: Refresh and commit world roster snapshot
        if: github.ref == 'refs/heads/feature/full-world-squads-2026-27' && github.event_name == 'push'
        run: |
          set -e
          target_branch="$GITHUB_REF_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A queued push run may start from an older commit. Always reload the latest
          # branch before validating or refreshing, then retry cleanly if another push wins.
          for attempt in 1 2 3; do
            git fetch origin "$target_branch"
            git reset --hard "origin/$target_branch"
            if node scripts/validate-world-roster-audit.cjs; then
              echo "The latest branch already contains a roster snapshot matching its source configuration."
              exit 0
            fi
            node scripts/refresh-world-squads.cjs
            node scripts/validate-world-roster-audit.cjs
            git add football-world-rosters.js public/football-world-rosters.js world-roster-audit.json public/world-roster-audit.json
            if git diff --cached --quiet; then
              echo "Roster snapshot is already current."
              exit 0
            fi
            git commit -m "Refresh 2026/27 verified world squad snapshot"
            if git push origin "HEAD:$target_branch"; then
              echo "Refreshed roster snapshot was committed successfully."
              exit 0
            fi
            echo "Roster push raced another branch update (attempt $attempt); reloading latest branch."
          done
          echo "Could not publish the roster snapshot after three attempts."
          exit 1
      - name: Verify checked-in roster snapshot matches source configuration
        run: node scripts/validate-world-roster-audit.cjs
      - name: Probe Arabic league roster source structure
        if: github.ref == 'refs/heads/feature/full-world-squads-2026-27' && github.event_name == 'push'
        continue-on-error: true
        run: node scripts/probe-arabic-roster-sources.cjs
      - run: npm test
      - run: npm run build

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Run real-browser smoke test
        run: node scripts/test-browser-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: last-whistle-browser-smoke
          path: ${{ runner.temp }}/last-whistle-browser-smoke.png
          if-no-files-found: ignore
